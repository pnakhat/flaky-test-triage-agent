name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Unit tests (guardrails)
        run: pytest -q
      - name: Evals (regression-recall gate)
        run: python evals/run_evals.py
      - name: Demo
        run: python -m triage examples/*.json
