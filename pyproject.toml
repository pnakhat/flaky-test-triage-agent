[project]
name = "flaky-test-triage-agent"
version = "0.1.0"
description = "Worked example of a decision-making QE agent that triages failed CI tests"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
